[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qutewarden"
version = "0.1.0"
description = "Bitwarden (rbw) userscript for qutebrowser"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["tldextract"]

[project.scripts]
qutewarden = "qutewarden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qutewarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "browser: needs playwright + chromium (deselect with -m 'not browser')",
  "e2e: real qutebrowser and rbw against a local Vaultwarden; runs only with --e2e (ADR-0007)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.11"
