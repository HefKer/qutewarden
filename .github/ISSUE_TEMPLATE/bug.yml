name: Bug report
description: Something in qutewarden doesn't work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste secrets.** Use a throwaway Item when you can. If you attach output from `qute://log` or `rbw`, read it first and remove anything secret.

        If this is a security problem (a secret leaking somewhere, or a Fill on the wrong page), don't open an issue: report it privately as described in [SECURITY.md](https://github.com/HefKer/qutewarden/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the subcommand and flags, and any message qutewarden showed.
    validations:
      required: true
  - type: input
    id: qutewarden
    attributes:
      label: qutewarden version
      description: "`qutewarden --version`"
    validations:
      required: true
  - type: input
    id: qutebrowser
    attributes:
      label: qutebrowser and QtWebEngine versions
      description: "From `:version` or `qutebrowser --version`"
    validations:
      required: true
  - type: input
    id: rbw
    attributes:
      label: rbw version
      description: "`rbw --version`"
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display server
      options:
        - Wayland
        - X11
    validations:
      required: true
  - type: input
    id: picker
    attributes:
      label: Picker
      description: The `picker` setting, or the default (fuzzel or rofi)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from `qute://log`, checked for secrets before pasting.
      render: text
