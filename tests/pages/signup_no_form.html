<!doctype html>
<html>
<head><meta charset="utf-8"><title>Create account</title></head>
<body>
  <header>
    <label>Search <input type="text" name="q" id="q"></label>
  </header>
  <div id="signup">
    <label>Username <input type="text" name="user" id="username" autocomplete="username"></label>
    <label>Password <input type="password" name="pw" id="password" autocomplete="new-password"></label>
    <label>Confirm <input type="password" name="pw2" id="confirm" autocomplete="new-password"></label>
    <button type="button">Sign up</button>
  </div>
</body>
</html>
