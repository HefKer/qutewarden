<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shipping address</title></head>
<body>
  <form id="address" action="/address" method="post">
    <label>Title <input type="text" name="title" id="title" autocomplete="honorific-prefix"></label>
    <label>First name <input type="text" name="first" id="given-name" autocomplete="shipping given-name"></label>
    <label>Middle name <input type="text" name="middle" id="additional-name" autocomplete="additional-name"></label>
    <label>Last name <input type="text" name="last" id="family-name" autocomplete="shipping family-name"></label>
    <label>Company <input type="text" name="company" id="organization" autocomplete="organization"></label>
    <label>Address <input type="text" name="line1" id="address-line1" autocomplete="shipping address-line1"></label>
    <label>Address line 2 <input type="text" name="line2" id="address-line2" autocomplete="shipping address-line2"></label>
    <label>City <input type="text" name="city" id="address-level2" autocomplete="shipping address-level2"></label>
    <label>State <input type="text" name="state" id="address-level1" autocomplete="shipping address-level1"></label>
    <label>Postal code <input type="text" name="zip" id="postal-code" autocomplete="shipping postal-code"></label>
    <label>Country
      <select name="country" id="country" autocomplete="shipping country">
        <option value="">Choose a country</option>
        <option value="CA">Canada</option>
        <option value="GB">United Kingdom</option>
        <option value="US">United States</option>
      </select>
    </label>
    <label>Email <input type="email" name="email" id="email" autocomplete="email"></label>
    <label>Phone <input type="tel" name="phone" id="tel" autocomplete="tel"></label>
    <label>Username <input type="text" name="user" id="username" autocomplete="username"></label>
    <label>Card number <input type="text" name="ccnumber" id="cc-number" autocomplete="cc-number"></label>
    <label>Gift message <input type="text" name="gift" id="gift"></label>
    <button type="submit" id="save">Continue</button>
  </form>
  <script>
    window.submitted = 0;
    window.events = [];
    document.getElementById("country").addEventListener(
      "change", (e) => window.events.push([e.target.id, e.type]));
    document.getElementById("address").addEventListener("submit", (e) => {
      e.preventDefault();
      window.submitted += 1;
    });
  </script>
</body>
</html>
