<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign in (custom fields)</title></head>
<body>
  <form id="login" action="/session" method="post">
    <label>Login <input type="text" name="login" id="username"></label>
    <label>Password <input type="password" name="password" id="password"></label>
    <input type="text" name="team" id="team">
    <input type="text" name="f2" id="Member-ID">
    <label for="backup">Backup code</label> <input type="text" name="f3" id="backup">
    <input type="text" name="f4" id="customer" aria-label="Customer number">
    <input type="text" name="f5" id="branch" placeholder="Branch">
    <input type="text" name="other" id="other">
    <!-- for the e2e Item "Example A" -->
    <input type="text" name="pin" id="pin">
    <label>Account <input type="text" name="f6" id="holder"></label>
    <input type="text" name="f7" id="question" placeholder="Question">
    <label><input type="checkbox" name="remember" id="remember"> Remember me</label>
    <label><input type="checkbox" name="terms" id="terms" checked> Terms</label>
    <label><input type="radio" name="plan" id="plan-pro"> Pro</label>
    <label><input type="radio" name="plan" id="plan-free" checked> Free</label>
    <button type="submit" id="submit">Sign in</button>
  </form>
  <script>
    window.events = [];
    for (const el of document.querySelectorAll("input")) {
      for (const type of ["input", "change"]) {
        el.addEventListener(type, (e) => window.events.push([e.target.id, e.type]));
      }
    }
    window.submitted = 0;
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      window.submitted += 1;
      window.submittedTeam = document.getElementById("team").value;
    });
  </script>
</body>
</html>
