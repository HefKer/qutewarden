<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign in (React-like)</title></head>
<body>
  <!-- No network in tests, so no real React. This emulates React's input
       value tracker: an instance-level `value` property that remembers the
       last value set through it. React's onChange only fires (and state only
       updates) when the DOM value differs from the tracked one, so a script
       that sets `el.value = x` directly is ignored, while the native
       prototype setter plus an `input` event is seen. -->
  <div id="app">
    <div class="field"><input type="text" id="username" placeholder="Username"></div>
    <div class="field"><input type="password" id="password" placeholder="Password"></div>
    <button type="button" id="submit">Sign in</button>
  </div>
  <script>
    window.state = { username: "", password: "" };
    window.clicked = 0;
    document.getElementById("submit").addEventListener("click", () => { window.clicked += 1; });
    const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
    for (const el of document.querySelectorAll("#app input")) {
      let tracked = el.value;
      Object.defineProperty(el, "value", {
        configurable: true,
        get() { return proto.get.call(this); },
        set(v) { tracked = String(v); proto.set.call(this, v); },
      });
      el.addEventListener("input", () => {
        const current = proto.get.call(el);
        if (current === tracked) return;   // React: no change → no onChange
        tracked = current;
        window.state[el.id] = current;
      });
    }
  </script>
</body>
</html>
